cases:
  - id: SKILL-001
    type: should_trigger
    title: example trigger case
    prompt: |
      Write a realistic user request where the target skill should be used.
    expected_contains:
      - "expected keyword or concept"
    forbidden_contains:
      - "term that would indicate wrong scope"

  - id: SKILL-002
    type: should_not_trigger
    title: example non-trigger case
    prompt: |
      Write a realistic adjacent request where the target skill should not be used.
    expected_contains:
      - "normal response concept"
    forbidden_contains:
      - "target skill-specific unwanted term"

  - id: SKILL-003
    type: output_quality
    title: example quality case
    prompt: |
      Write a realistic request where the target skill should produce a high-quality output.
    expected_contains:
      - "expected structure"
      - "expected practical detail"
    forbidden_contains:
      - "undesired behavior"

  - id: SKILL-004
    type: regression
    title: example regression case
    prompt: |
      Reuse an important stable prompt before and after changing the target skill.
    expected_contains:
      - "stable expected concept"
    forbidden_contains:
      - "known regression symptom"
